name: ftp
description: "Simple ftp client"

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.0
  auto_route: ^10.0.1
  ftpconnect: ^2.0.7
  google_fonts: ^6.2.1
  intl: ^0.20.2
  logger: ^2.6.0
  provider: ^6.1.5

dev_dependencies:
  auto_route_generator: ^10.0.1
  build_runner: ^2.4.15
  dart_code_linter: ^2.0.0
  flutter_gen: ^5.10.0
  flutter_test:
    sdk: flutter

dependency_overrides:
  analyzer_plugin: ^0.12.0
  analyzer: ^7.0.0
  intl: ^0.19.0


flutter:
  generate: true