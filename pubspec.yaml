name: ftp
description: "Simple ftp client"

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  auto_route: ^10.1.2
  ftpconnect: ^2.0.10
  google_fonts: ^6.3.1
  intl: ^0.20.2
  provider: ^6.1.5
  freezed_annotation: ^3.1.0
  drift: ^2.28.1
  drift_flutter: ^0.2.5
  path_provider: ^2.1.5
  talker_flutter: ^5.0.0

dev_dependencies:
  auto_route_generator: ^10.2.4
  build_runner: ^2.7.0
  dart_code_linter: ^3.0.0
  drift_dev: ^2.28.1
  flutter_gen: ^5.11.0
  freezed: ^3.2.0
  flutter_test:
    sdk: flutter

# dependency_overrides:


flutter:
  uses-material-design: true
  generate: true